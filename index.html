<!DOCTYPE html>
<html lang="es-BO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CochaPet</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="./src/estilos.css" />
  </head>
  <body>
    <header class="encabezado">
      <span class="marca">Cocha<span class="marca-acento">Pet</span></span>
    </header>
    <main class="contenedor">
      <div id="vista-lista"></div>
      <section id="vista-detalle" hidden>
        <a href="#/" class="enlace-volver">← Volver</a>
        <div class="detalle-tarjeta">
        <div id="detalle-fotos"></div>
        <h2 id="detalle-titulo"></h2>
        <p id="detalle-datos"></p>
        <p id="detalle-descripcion"></p>
        <div class="detalle-acciones">
        <a id="detalle-whatsapp" class="boton boton-whatsapp" target="_blank" rel="noopener"><span class="icono icono-whatsapp" aria-hidden="true"></span>Escribir por WhatsApp</a>
        <a id="detalle-llamar" class="boton boton-llamar"><span class="icono icono-llamar" aria-hidden="true"></span>Llamar</a>
        </div>
        <p id="aviso-seguridad" class="aviso-seguridad" role="note"><strong>⚠️ Cuidado con las estafas:</strong> nunca pagues recompensas ni envíes dinero por adelantado. Entrega o recibe la recompensa solo cuando veas a la mascota en persona.</p>
        </div>
      </section>
      <dialog id="visor">
        <form method="dialog"><button id="visor-cerrar" class="visor-cerrar" aria-label="Cerrar">×</button></form>
        <img id="visor-foto" alt="Foto ampliada de la mascota" />
        <p id="visor-contador"></p>
        <button id="visor-anterior" class="boton" type="button">Anterior</button>
        <button id="visor-siguiente" class="boton" type="button">Siguiente</button>
      </dialog>
    </main>

    <script type="module" src="./src/presenter.js"></script>
    <script type="module" src="./src/detallePresenter.js"></script>
  </body>
</html>
